<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking Room 2</title>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<section class="ux-frame" data-screen="book-room">
  <header><h2>Booking a room</h2>
    <p class="ux-over">opens over Today</p></header>
  <div class="ux-dialog">
    <h3 class="ux-heading">Room 2 — free until 10:30</h3>
    <p class="ux-input" data-ux="patient-name">Patient name</p>
    <div class="ux-choice" data-ux="how-long">How long?
      <ul>
        <li>15 min</li>
        <li>30 min</li>
        <li>45 min</li>
      </ul>
    </div>
    <a class="ux-action is-primary" href="today-booked-en.html" data-ux="book">Book</a>
    <a class="ux-link" href="today-default-en.html" data-ux="cancel">Cancel</a>
  </div>
</section>
</body>
</html>
