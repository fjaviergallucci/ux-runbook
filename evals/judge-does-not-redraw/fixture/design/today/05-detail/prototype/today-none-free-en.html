<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today, no room free</title>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<section class="ux-frame" data-screen="today">
  <header><h2>Today</h2></header>
  <div class="ux-screen">
    <h3 class="ux-heading">Rooms right now</h3>
    <p class="ux-status" data-ux="free-count">No room is free.</p>
    <p class="ux-text" data-ux="empty-message">Try again later.</p>
    <p class="ux-status" data-ux="last-updated">Updated 9:40</p>
  </div>
</section>
</body>
</html>
