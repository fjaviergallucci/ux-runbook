schema_version: "1.1"
name: correction-is-one-nod
description: >-
  Asks the session to put one wrong label right, in a project that is set up and has no package for it.
expected_outcome: |
  - Its last message frames the request in one line: the request in his words, a kind, a foundation, the size `correction`, and the route.
  - It asks one question, whether that is the right frame, and nothing else.
  - It casts no seat: it names none as sitting, and starts no sub-agent.
  - Nothing is changed before his yes: no file is written or edited, no package is made, and its message does not say the label was changed.
  - What a correction does after his yes (the before-and-after picture, his one nod, the one-paragraph record) is not in this case: it needs his answers and a browser.
context:
  add_dirs: [fixture]
