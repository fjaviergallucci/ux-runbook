schema_version: "1.1"
name: correction-is-one-nod
description: >-
  Asks the session to put one wrong label right, in a project that is set up and has no package for it.
expected_outcome: |
  - Frame's skill is invoked.
  - Its last message states the frame in one line: the request in his words, a kind, a foundation, the size `correction`, and the route.
  - The frame is not put to him as a question: the message asks at most one question, and if it asks one it is the nod.
  - It casts no seat: it names none as sitting, and starts no sub-agent.
  - Nothing in the project's source is changed: no Write, no Edit and no command writes into the fixture.
  - Not tested here, because a run's shell cannot write and so the package cannot be made: the picture of before and after, the nod on it, and the one-paragraph record.
context:
  add_dirs: [fixture]
