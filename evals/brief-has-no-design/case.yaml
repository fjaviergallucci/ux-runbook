schema_version: "1.1"
name: brief-has-no-design
description: >-
  Asks the session to take a design that is in work at Structure as far as the brief its describers will be sent.
expected_outcome: |
  - The brief is written at design/today/04-structure/BRIEF.md, in the run's folder.
  - Its sections for the person, the job, the tasks and what the product can show and do are filled from the package, and no instruction of the template is left in them.
  - It names no component and no layout, and no visual style, colour or font.
  - It holds no idea of the session's own: no sentence says what a screen should hold, and no example sketches one.
context:
  add_dirs: [fixture]
