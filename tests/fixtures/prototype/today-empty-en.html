<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today, no room free</title>
<link rel="stylesheet" href="kit.css">
</head>
<body>

    <div class="ux-list" data-ux="room-list">Every room, soonest free first
      <ul>
        <li>Room 1 — Dan with Maria K., until 10:00</li>
        <li>Room 2 — Ana with Luis P., until 10:30</li>
        <li>Sala Jardín — physiotherapy group, until 11:15</li>
      </ul>
    </div>
  </div>
</section>
</body>
</html>
