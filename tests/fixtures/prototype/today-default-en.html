<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today, rooms free</title>
<link rel="stylesheet" href="kit.css">
<style>
  /* The design's target size for the one action the screen is for. */
  .ux-action.is-primary { min-width: 2.75rem; min-height: 2.75rem; }
</style>
</head>
<body>
<section class="ux-frame" data-screen="today">
  <header><h2>Today</h2></header>
  <div class="ux-screen">
    <h3 class="ux-heading">Rooms right now</h3>
    <p class="ux-status" data-ux="free-count">2 rooms free</p>
    <div class="ux-list" data-ux="room-list">Every room, soonest free first
      <ul>
        <li data-ux="free-room-2">Room 2 — free until 10:30</li>
        <li data-ux="free-room-jardin">Sala Jardín — free until 11:15</li>
        <li>Room 1 — Dan with Maria K., until 10:00</li>
        <li>Room 3 — being cleaned, ready at 9:50</li>
      </ul>
    </div>
    <button class="ux-action is-primary" type="button" data-ux="book-action">Book a walk-in</button>
  </div>
</section>
</body>
</html>
